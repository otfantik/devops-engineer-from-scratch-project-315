---
- name: Configure bulletin server
  hosts: hexlet-devops-project3
  become: yes
  vars_files:
    - ansible/vault.yml

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - gnupg
          - lsb-release
          - ufw
          - python3-pip
          - virtualenv
        state: present

    - name: Install Docker with community.docker collection
      community.docker.docker:
        name: docker
        state: present

    - name: Install Docker Compose
      community.docker.docker_compose:
        name: docker-compose
        state: present

    - name: Add user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Configure UFW
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - '22'
        - '80'
        - '443'
        - '8080'

    - name: Enable UFW
      ufw:
        state: enabled
        policy: deny

    - name: Install Nginx using nginxinc collection
      nginxinc.nginx_core.nginx:
        state: present

    - name: Start and enable Nginx
      systemd:
        name: nginx
        state: started
        enabled: yes

    - name: Install Certbot using community.crypto
      community.crypto.certbot:
        state: present
        email: "{{ certbot_email }}"
        domains: "{{ domain_name }}"
        agree_tos: yes